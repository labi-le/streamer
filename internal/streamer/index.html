<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Perfect Sync</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #111; color: #eee; text-align: center; margin: 0; min-height: 100vh; position: relative; }

        #bg-art {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            filter: blur(40px) brightness(0.3); z-index: -1;
            transition: background-image 1s ease-in-out;
        }

        #toggle-ui {
            position: fixed; top: 15px; right: 15px; z-index: 100;
            opacity: 0.6; cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            color: white; border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 15px; border-radius: 8px;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        #toggle-ui:hover { opacity: 1; background: rgba(255, 255, 255, 0.2); border-color: rgba(255, 255, 255, 0.4); }

        #player-view { position: relative; z-index: 2; margin-top: 50px; }
        #main-art {
            width: 320px; height: 320px; margin: 0 auto 15px;
            background-size: cover; background-position: center;
            border-radius: 20px; box-shadow: 0 15px 45px rgba(0,0,0,0.6);
            background-color: #222;
        }
        #track-name { font-size: 24px; text-shadow: 0 2px 10px rgba(0,0,0,0.8); margin: 10px 0; }
        #status { font-weight: 300; opacity: 0.8; letter-spacing: 1px; margin-bottom: 20px; text-transform: uppercase; font-size: 14px; }

        .content { position: relative; z-index: 1; transition: opacity 0.5s ease; padding-top: 20px; }
        .hidden { display: none !important; }

        #action-area {
            height: 50px;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn {
            min-width: 160px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: rgba(255, 0, 0, 0.15);
            border: 1px solid rgba(255, 0, 0, 0.3);
            color: white;
        }
        .btn-primary:hover { background: rgba(255, 0, 0, 0.25); border-color: rgba(255, 0, 0, 0.5); }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.2); border-color: rgba(255, 255, 255, 0.4); }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 900px; margin: 0 auto; text-align: left;}

        .list-box {
            background: transparent;
            backdrop-filter: blur(80px);
            -webkit-backdrop-filter: blur(80px);
            padding: 15px;
            border-radius: 16px;
            height: 500px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
        }

        #library-list, #queue-list { overflow-y: auto; flex-grow: 1; margin-top: 10px; padding-right: 5px; }
        #library-list::-webkit-scrollbar, #queue-list::-webkit-scrollbar { width: 4px; }
        #library-list::-webkit-scrollbar-thumb, #queue-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.4); border-radius: 10px; }
        #library-list::-webkit-scrollbar-track, #queue-list::-webkit-scrollbar-track { background: transparent; }

        .track-item {
            padding: 12px;
            margin: 6px 0;
            background: rgba(255,255,255,0.05);
            cursor: pointer;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
        }
        .track-item:hover {
            background: rgba(255,255,255,0.15);
            transform: translateX(5px);
            border-color: rgba(255,255,255,0.2);
        }

        #search-input {
            width: 100%; padding: 12px; margin-bottom: 10px; box-sizing: border-box;
            background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px; font-size: 14px;
        }
        #search-input:focus { outline: none; border-color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.15); }
    </style>
</head>
<body>
<div id="bg-art"></div>
<button id="toggle-ui" onclick="toggleUI()">Show/Hide UI</button>

<div id="player-view">
    <div id="main-art"></div>
    <h3 id="track-name">Loading...</h3>
</div>

<div class="content" id="main-content">
    <h4 id="status">Waiting to join...</h4>

    <div id="action-area">
        <button id="start-btn" onclick="initSystem()" class="btn btn-primary">JOIN RADIO</button>
        <button id="next-btn" onclick="skipTrack()" class="btn btn-secondary hidden">NEXT TRACK</button>
    </div>

    <div class="grid">
        <div class="list-box">
            <h3>Library</h3>
            <input type="text" id="search-input" placeholder="Search track...">
            <div id="library-list"></div>
        </div>
        <div class="list-box">
            <h3>Queue</h3>
            <div id="queue-list"></div>
        </div>
    </div>
</div>
<script src="/sync.js"></script>
</body>
</html>
