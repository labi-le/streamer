<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Perfect Sync</title>
    <style>
        :root {
            --primary-color: rgba(255, 0, 0, 0.15);
            --primary-border: rgba(255, 0, 0, 0.3);
            --bg-color: #111;
            --text-color: #eee;
            --blur-bg: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            background: var(--bg-color);
            color: var(--text-color);
            text-align: center;
            margin: 0;
            min-height: 100vh;
            position: relative;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        #bg-art {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            filter: blur(40px) brightness(0.3); z-index: -1;
            transition: background-image 1s ease-in-out;
        }

        #toggle-ui {
            position: fixed; top: 15px; right: 15px; z-index: 100;
            opacity: 0.6; cursor: pointer;
            background: var(--blur-bg);
            color: white; border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 15px; border-radius: 8px;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        #toggle-ui:hover { opacity: 1; background: rgba(255, 255, 255, 0.2); }

        #player-view { position: relative; z-index: 2; margin-top: 30px; }
        
        #main-art {
            width: 100%; max-width: 320px;
            aspect-ratio: 1/1;
            margin: 0 auto 15px;
            background-size: cover; background-position: center;
            border-radius: 20px; box-shadow: 0 15px 45px rgba(0,0,0,0.6);
            background-color: #222;
        }

        #track-name { font-size: 24px; text-shadow: 0 2px 10px rgba(0,0,0,0.8); margin: 10px 0; word-wrap: break-word;}
        #status { font-weight: 300; opacity: 0.8; letter-spacing: 1px; margin-bottom: 20px; text-transform: uppercase; font-size: 14px; }

        .content { position: relative; z-index: 1; transition: opacity 0.5s ease; padding-top: 10px; }
        .hidden { display: none !important; }

        #action-area {
            height: 50px;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .btn {
            min-width: 140px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            touch-action: manipulation;
        }

        .btn-primary {
            background: var(--primary-color);
            border: 1px solid var(--primary-border);
            color: white;
        }
        .btn-primary:hover { background: rgba(255, 0, 0, 0.25); border-color: rgba(255, 0, 0, 0.5); }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.2); border-color: rgba(255, 255, 255, 0.4); }

        .grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
            max-width: 900px; 
            margin: 0 auto; 
            text-align: left;
        }

        .list-box {
            background: transparent;
            backdrop-filter: blur(80px);
            -webkit-backdrop-filter: blur(80px);
            padding: 15px;
            border-radius: 16px;
            height: 500px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease;
        }

        #library-list, #queue-list { overflow-y: auto; flex-grow: 1; margin-top: 10px; padding-right: 5px; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.4); border-radius: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }

        .track-item {
            padding: 12px;
            margin: 6px 0;
            background: rgba(255,255,255,0.05);
            cursor: pointer;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.2s ease;
            font-size: 14px;
        }
        .track-item:active { transform: scale(0.98); }
        .track-item:hover {
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.2);
        }

        #search-input {
            width: 100%; padding: 12px; margin-bottom: 10px; box-sizing: border-box;
            background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px; font-size: 14px;
        }
        #search-input:focus { outline: none; border-color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.15); }

        /* Mobile Specifics */
        #mobile-tabs { display: none; margin-bottom: 15px; justify-content: center; gap: 10px; }
        .tab-btn {
            padding: 10px 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #aaa;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            flex: 1;
            max-width: 150px;
        }
        .tab-btn.active {
            background: rgba(255,255,255,0.2);
            color: white;
            border-color: rgba(255,255,255,0.3);
        }

        @media (max-width: 768px) {
            body { padding: 10px; }
            #player-view { margin-top: 10px; }
            #main-art { max-width: 260px; }
            .grid { display: block; }
            
            #mobile-tabs { display: flex; }
            
            .list-box {
                height: auto;
                min-height: 400px;
                max-height: 60vh;
                margin-bottom: 80px; /* Space for bottom interaction */
            }
            
            .mobile-hidden { display: none !important; }
            
            #action-area { flex-direction: column; height: auto; gap: 10px; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>
<div id="bg-art"></div>
<button id="toggle-ui" onclick="toggleUI()">UI</button>

<div id="player-view">
    <div id="main-art"></div>
    <h3 id="track-name">Loading...</h3>
</div>

<div class="content" id="main-content">
    <h4 id="status">Waiting to join...</h4>

    <div id="action-area">
        <button id="start-btn" onclick="initSystem()" class="btn btn-primary">JOIN</button>
        <button id="next-btn" onclick="skipTrack()" class="btn btn-secondary hidden">NEXT</button>
    </div>

    <!-- Mobile Tab Navigation -->
    <div id="mobile-tabs">
        <button id="tab-library" class="tab-btn active" onclick="switchTab('library')">Library</button>
        <button id="tab-queue" class="tab-btn" onclick="switchTab('queue')">Queue</button>
    </div>

    <div class="grid">
        <div id="library-box" class="list-box">
            <h3>Library</h3>
            <input type="text" id="search-input" placeholder="Search track...">
            <div id="library-list"></div>
        </div>
        <div id="queue-box" class="list-box mobile-hidden">
            <h3>Queue</h3>
            <div id="queue-list"></div>
        </div>
    </div>
</div>
<script src="/sync.js"></script>
</body>
</html>
