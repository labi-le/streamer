<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Potok</title>
    <style>
        :root {
            --primary-color: rgba(255, 0, 0, 0.15);
            --primary-border: rgba(255, 0, 0, 0.3);
            --bg-color: #111;
            --text-color: #eee;
            --blur-bg: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            background: var(--bg-color);
            color: var(--text-color);
            text-align: center;
            margin: 0;
            min-height: 100vh;
            position: relative;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        #bg-art {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            filter: blur(40px) brightness(0.3); z-index: -1;
            transition: background-image 1s ease-in-out;
        }

        #toggle-ui {
            position: fixed; top: 15px; right: 15px; z-index: 100;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.15);
            color: white; border: none;
            padding: 8px 14px; border-radius: 20px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            font-size: 13px; font-weight: 500;
            transition: all 0.2s;
        }
        #toggle-ui:hover { background: rgba(255, 255, 255, 0.25); }

        #player-view { position: relative; z-index: 2; margin-top: 30px; }

        #main-art {
            width: 100%; max-width: 320px;
            aspect-ratio: 1/1;
            margin: 0 auto 15px;
            background-size: cover; background-position: center;
            border-radius: 20px; box-shadow: 0 15px 45px rgba(0,0,0,0.6);
            background-color: #222;
        }

        #track-name { font-size: 24px; font-weight: 600; text-shadow: 0 2px 10px rgba(0,0,0,0.8); margin: 10px 0 4px; word-wrap: break-word;}
        #listeners {
            position: fixed; bottom: 20px; right: 20px;
            font-size: 13px; font-weight: 500;
            display: flex; align-items: center; gap: 6px;
            z-index: 100; opacity: 0.8;
        }
        #listeners::before {
            content: '';
            width: 8px; height: 8px;
            background: #ff3b30;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        #progress-wrap { max-width: 320px; margin: 24px auto 20px; }
        #progress-time {
            display: flex; justify-content: space-between;
            font-size: 11px; opacity: 0.4; margin-bottom: 6px;
            font-variant-numeric: tabular-nums;
        }
        #progress-track {
            height: 3px; border-radius: 2px;
            background: rgba(255,255,255,0.15);
            overflow: hidden;
        }
        #progress-fill {
            height: 100%; width: 0%;
            background: rgba(255,255,255,0.7);
            border-radius: 2px;
        }

        .content { position: relative; z-index: 1; transition: opacity 0.5s ease; padding-top: 10px; }
        .hidden { display: none !important; }

        #start-btn, #next-btn { display: block; margin: 10px auto 25px; min-width: 0; padding: 8px 28px; font-size: 15px; }

        .btn {
            min-width: 140px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 12px;
            border: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.2s ease;
            touch-action: manipulation;
        }
        .btn:active { transform: scale(0.97); }

        .btn-primary {
            background: rgba(255, 255, 255, 0.85);
            color: #111;
        }
        .btn-primary:hover { background: white; }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.25); }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 65%;
            margin: 0 auto;
            text-align: left;
        }

        .list-box {
            background: transparent;
            backdrop-filter: blur(80px);
            -webkit-backdrop-filter: blur(80px);
            padding: 15px;
            border-radius: 16px;
            height: 55vh;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease;
        }
        .list-box h3 { text-transform: uppercase; font-size: 11px; letter-spacing: 0.08em; opacity: 0.5; }

        #library-list, #queue-list { overflow-y: auto; flex-grow: 1; margin-top: 10px; padding-right: 5px; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.4); border-radius: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }

        .track-item {
            padding: 12px;
            margin: 6px 0;
            background: rgba(255,255,255,0.05);
            cursor: pointer;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.2s ease;
            font-size: 14px;
        }
        .track-item:active { transform: scale(0.98); }
        .track-item:hover {
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.2);
        }

        #search-input {
            width: 100%; padding: 10px 12px; margin-bottom: 10px; box-sizing: border-box;
            background: rgba(255,255,255,0.1); color: white; border: none;
            border-radius: 10px; font-size: 14px;
        }
        #search-input::placeholder { color: rgba(255,255,255,0.4); }
        #search-input:focus { outline: none; background: rgba(255,255,255,0.18); }

        #mobile-tabs {
            display: none; margin-bottom: 15px; justify-content: center;
            background: rgba(255,255,255,0.1);
            border-radius: 9px; padding: 2px;
            width: fit-content; margin-left: auto; margin-right: auto;
        }
        .tab-btn {
            padding: 7px 24px;
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.6);
            border-radius: 7px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        @media (max-width: 768px) {
            body { padding: 16px; }
            #player-view { margin-top: 10px; }
            #main-art { max-width: 260px; }
            .grid { display: block; width: 100%; }

            #mobile-tabs { display: flex; }

            .list-box {
                height: 70vh;
                box-sizing: border-box;
                margin-bottom: 80px;
            }

            .mobile-hidden { display: none !important; }

            #start-btn, #next-btn { width: 100%; }
        }
    </style>
</head>
<body>
<div id="bg-art"></div>
<button id="toggle-ui" onclick="toggleUI()">UI</button>
<div id="listeners"></div>

<div id="player-view">
    <div id="main-art"></div>
    <h3 id="track-name">Loading...</h3>
    <div id="progress-wrap">
        <div id="progress-time"><span id="time-elapsed">0:00</span><span id="time-remaining">0:00</span></div>
        <div id="progress-track"><div id="progress-fill"></div></div>
    </div>
    <button id="start-btn" onclick="initSystem()" class="btn btn-primary">Join</button>
    <button id="next-btn" onclick="skipTrack()" class="btn btn-secondary hidden">Next</button>
</div>

<div class="content" id="main-content">

    <div id="mobile-tabs">
        <button id="tab-library" class="tab-btn active" onclick="switchTab('library')">Library</button>
        <button id="tab-queue" class="tab-btn" onclick="switchTab('queue')">Queue</button>
    </div>

    <div class="grid">
        <div id="library-box" class="list-box">
            <h3>Library</h3>
            <input type="text" id="search-input" placeholder="Search track...">
            <div id="library-list"></div>
        </div>
        <div id="queue-box" class="list-box mobile-hidden">
            <h3>Queue</h3>
            <div id="queue-list"></div>
        </div>
    </div>
</div>
<script src="/sync.js"></script>
</body>
</html>
