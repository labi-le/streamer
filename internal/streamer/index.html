<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Perfect Sync</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #111; color: #eee; text-align: center; margin: 0; min-height: 100vh; position: relative; }
        #bg-art {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            filter: blur(40px) brightness(0.3); z-index: -1;
            transition: background-image 1s ease-in-out;
        }
        .content { position: relative; z-index: 1; transition: opacity 0.5s ease; padding-top: 20px; }
        #player-view { position: relative; z-index: 2; margin-top: 50px; }
        #main-art {
            width: 320px; height: 320px; margin: 0 auto 15px;
            background-size: cover; background-position: center;
            border-radius: 20px; box-shadow: 0 15px 45px rgba(0,0,0,0.6);
            background-color: #222;
        }
        #track-name { font-size: 22px; text-shadow: 0 2px 10px rgba(0,0,0,0.8); margin: 10px 0; }
        button { padding: 10px 20px; font-size: 16px; margin: 5px; cursor: pointer; background: #333; color: white; border: none; border-radius: 5px;}
        button:active { background: #555; }
        #start-btn { background: #b00; padding: 20px 40px; font-size: 24px; font-weight: bold; margin-bottom: 20px; }
        #controls { display: none; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 800px; margin: 0 auto; text-align: left;}
        .list-box { background: #222; padding: 15px; border-radius: 8px; height: 500px; display: flex; flex-direction: column; }
        #library-list, #queue-list { overflow-y: auto; flex-grow: 1; margin-top: 10px; padding-right: 5px; }
        #library-list::-webkit-scrollbar, #queue-list::-webkit-scrollbar { width: 6px; }
        #library-list::-webkit-scrollbar-thumb, #queue-list::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
        #library-list::-webkit-scrollbar-track, #queue-list::-webkit-scrollbar-track { background: #222; }
        .track-item { padding: 8px; margin: 5px 0; background: #333; cursor: pointer; border-radius: 4px; display: flex; justify-content: space-between; }
        .track-item:hover { background: #444; }
        #search-input { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; background: #333; color: white; border: 1px solid #555; border-radius: 4px; font-size: 14px;}
        #search-input:focus { outline: none; border-color: #888; }
        .hidden { display: none !important; }
        #toggle-ui { position: fixed; top: 10px; right: 10px; z-index: 100; opacity: 0.5; }
        #toggle-ui:hover { opacity: 1; }
    </style>
</head>
<body>
<div id="bg-art"></div>
<button id="toggle-ui" onclick="toggleUI()">Show/Hide UI</button>

<div id="player-view">
    <div id="main-art"></div>
    <h3 id="track-name">Loading track...</h3>
</div>

<div class="content" id="main-content">
<h2>Web Audio API Sync</h2>
<h4 id="status">Waiting to join...</h4>

<button id="start-btn" onclick="initSystem()">JOIN RADIO</button>

<div id="controls">
    <button onclick="skipTrack()">Force Next Track</button>
</div>

<div class="grid">
    <div class="list-box">
        <h3>Library (Click to add)</h3>
        <input type="text" id="search-input" placeholder="Fuzzy search track...">
        <div id="library-list"></div>
    </div>
    <div class="list-box">
        <h3>Queue (Click to remove)</h3>
        <div id="queue-list"></div>
    </div>
</div>
</div>
<script src="/sync.js"></script>
</body>
</html>
